<!doctype html>
<html lang="ro">
<meta charset="utf-8">
<title>Quiz live</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Anton&family=Montserrat:wght@600;800;900&display=swap">
<style>
  /* Quiz de cultură generală pentru TikTok LIVE: cadru vertical 9:16, se rulează singur, la nesfârșit */
  :root {
    --bg0: #0b0820; --bg1: #1a0f3d; --ink: #fbf8ff; --muted: rgba(251, 248, 255, .7);
    --a: #ff4d6d; --b: #3d8bff; --c: #ffc93c; --d: #2fd38a; --ok: #2fd38a; --gold: #ffd166;
    --f-slam: "Anton", "Impact", "Arial Narrow", sans-serif; --f-cap: "Montserrat", "Arial Black", system-ui, sans-serif;
    color-scheme: dark;
  }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  html, body { height: 100%; margin: 0; background: #000; overflow: hidden; }
  body { display: grid; place-items: center; font-family: var(--f-cap); color: var(--ink); }
  .stage { position: relative; height: 100vh; width: calc(100vh * 9 / 16); max-width: 100vw; max-height: calc(100vw * 16 / 9); overflow: hidden; container-type: inline-size;
    background: radial-gradient(120% 70% at 50% 0%, #2a1866 0%, var(--bg1) 40%, var(--bg0) 100%); }
  canvas#fx { position: absolute; inset: 0; width: 100%; height: 100%; }
  .top { position: absolute; left: 5%; right: 5%; top: 3.2%; display: flex; align-items: center; justify-content: space-between; z-index: 3; }
  .brand { white-space: nowrap; font: 400 6cqw/1 var(--f-slam); letter-spacing: .02em; text-transform: uppercase; text-shadow: 0 .4cqw 2cqw rgba(0, 0, 0, .5); }
  .brand em { font-style: normal; color: var(--gold); }
  .live { display: flex; align-items: center; gap: 1.6cqw; padding: 1.2cqw 2.6cqw; border-radius: 99px; background: rgba(255, 77, 109, .18); border: 1px solid rgba(255, 77, 109, .55); font: 900 3.2cqw/1 var(--f-cap); letter-spacing: .14em; }
  .live i { width: 2cqw; height: 2cqw; border-radius: 50%; background: var(--a); box-shadow: 0 0 2cqw var(--a); animation: pulse 1.2s infinite; }
  @keyframes pulse { 50% { opacity: .35; } }
  .meta { position: absolute; left: 5%; right: 5%; top: 9.3%; display: flex; justify-content: space-between; align-items: center; z-index: 3; }
  .chip { padding: 1.3cqw 3cqw; border-radius: 99px; background: rgba(255, 255, 255, .1); border: 1px solid rgba(255, 255, 255, .18); font: 800 3.2cqw/1 var(--f-cap); letter-spacing: .1em; text-transform: uppercase; }
  .chip.cat { background: rgba(255, 209, 102, .16); border-color: rgba(255, 209, 102, .5); color: var(--gold); }

  .card { position: absolute; left: 5%; right: 5%; top: 14.2%; z-index: 3; padding: 5cqw 5cqw 5.5cqw; border-radius: 5cqw; background: rgba(255, 255, 255, .08); border: 1px solid rgba(255, 255, 255, .16);
    box-shadow: 0 3cqw 8cqw rgba(0, 0, 0, .35); backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px); transition: transform .5s cubic-bezier(.2, .8, .2, 1), opacity .4s; }
  .card .q { font: 900 6.6cqw/1.18 var(--f-cap); text-align: center; text-wrap: balance; }
  .card.out { transform: translateX(-110%) rotate(-4deg); opacity: 0; } .card.in0 { transform: translateX(110%) rotate(4deg); opacity: 0; transition: none; }

  .timer { position: absolute; left: 50%; top: 38.2%; width: 18cqw; height: 18cqw; margin-left: -9cqw; z-index: 4; }
  .timer svg { width: 100%; height: 100%; transform: rotate(-90deg); }
  .timer .n { position: absolute; inset: 0; display: grid; place-items: center; font: 400 8.6cqw/1 var(--f-slam); }
  .timer.hot .n { color: var(--a); animation: beat .5s infinite; } @keyframes beat { 50% { transform: scale(1.12); } }

  .opts { position: absolute; left: 5%; right: 5%; top: 49.5%; z-index: 3; display: grid; gap: 2.2cqw; }
  .opt { position: relative; display: flex; align-items: center; gap: 3.2cqw; padding: 2.6cqw 3.2cqw; border-radius: 3.4cqw; background: rgba(255, 255, 255, .09); border: 1px solid rgba(255, 255, 255, .16);
    font: 800 5cqw/1.15 var(--f-cap); overflow: hidden; transition: transform .35s, opacity .35s, background .35s, border-color .35s; }
  .opt b { flex: none; width: 9cqw; height: 9cqw; border-radius: 2.4cqw; display: grid; place-items: center; font: 400 6cqw/1 var(--f-slam); color: #170b2c; }
  .opt:nth-child(1) b { background: var(--a); } .opt:nth-child(2) b { background: var(--b); } .opt:nth-child(3) b { background: var(--c); } .opt:nth-child(4) b { background: var(--d); }
  .opt .bar { position: absolute; left: 0; top: 0; bottom: 0; width: 0; background: rgba(255, 255, 255, .1); transition: width .8s cubic-bezier(.2, .8, .2, 1); }
  .opt .pc { margin-left: auto; font: 900 4.2cqw/1 var(--f-cap); opacity: 0; transition: opacity .4s; position: relative; }
  .opt span { position: relative; }
  .opts.reveal .opt { opacity: .38; transform: scale(.97); }
  .opts.reveal .opt.ok { opacity: 1; transform: scale(1.03); background: rgba(47, 211, 138, .22); border-color: var(--ok); box-shadow: 0 0 5cqw rgba(47, 211, 138, .35); }
  .opts.reveal .opt.ok::after { content: "✓"; position: relative; margin-left: 2cqw; font: 900 6cqw/1 var(--f-cap); color: var(--ok); }
  .opts.reveal .opt .pc { opacity: 1; }
  .opt.in0 { transform: translateY(6cqw); opacity: 0; transition: none; }

  .cta { position: absolute; left: 5%; right: 5%; bottom: 4.2%; z-index: 3; text-align: center; font: 900 5cqw/1.2 var(--f-cap); text-transform: uppercase; letter-spacing: .02em; text-shadow: 0 .4cqw 2cqw rgba(0, 0, 0, .5); }
  .cta em { font-style: normal; color: var(--gold); }
  .count { margin-top: 1.4cqw; font: 800 3.4cqw/1 var(--f-cap); color: var(--muted); letter-spacing: .08em; text-transform: none; }
  .fact { position: absolute; left: 5%; right: 5%; bottom: 2.6%; z-index: 4; padding: 2.8cqw 3.6cqw; border-radius: 3.4cqw; background: rgba(255, 209, 102, .14); border: 1px solid rgba(255, 209, 102, .5);
    font: 700 3.5cqw/1.32 var(--f-cap); text-align: center; opacity: 0; transform: translateY(4cqw); transition: opacity .4s, transform .5s; }
  .fact.on { opacity: 1; transform: none; } .fact b { color: var(--gold); }
  .winners { position: absolute; left: 5%; right: 5%; top: 40.6%; z-index: 4; display: flex; gap: 2cqw; justify-content: center; flex-wrap: wrap; font: 800 3.4cqw/1 var(--f-cap); opacity: 0; transition: opacity .4s; }
  .winners.on { opacity: 1; } .winners span { padding: 1.2cqw 2.4cqw; border-radius: 99px; background: rgba(47, 211, 138, .18); border: 1px solid rgba(47, 211, 138, .5); }
  .foot { display: none; position: absolute; left: 5%; right: 5%; bottom: 3.6%; z-index: 3; text-align: center; font: 800 3.1cqw/1.3 var(--f-cap); color: var(--muted); letter-spacing: .06em; }

  .inter { position: absolute; inset: 0; z-index: 6; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4cqw; text-align: center; padding: 0 8%;
    background: radial-gradient(circle at 50% 45%, rgba(42, 24, 102, .92), rgba(11, 8, 32, .97)); opacity: 0; pointer-events: none; transition: opacity .5s; }
  .inter.on { opacity: 1; }
  .inter h2 { margin: 0; font: 400 13cqw/.95 var(--f-slam); text-transform: uppercase; } .inter h2 em { font-style: normal; color: var(--gold); }
  .inter p { margin: 0; font: 800 4.6cqw/1.35 var(--f-cap); color: var(--muted); }
  .board { width: 100%; display: grid; gap: 2cqw; }
  .board div { display: flex; justify-content: space-between; padding: 2.4cqw 3.6cqw; border-radius: 3cqw; background: rgba(255, 255, 255, .08); border: 1px solid rgba(255, 255, 255, .14); font: 800 4.4cqw/1 var(--f-cap); }
  .board div:first-child { background: rgba(255, 209, 102, .18); border-color: rgba(255, 209, 102, .55); }
  .ws { position: absolute; right: 5%; top: 7.4%; z-index: 3; font: 800 2.6cqw/1 var(--f-cap); color: var(--muted); letter-spacing: .08em; }
  .start { position: absolute; inset: 0; z-index: 9; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 5cqw; text-align: center; padding: 0 8%; background: rgba(11, 8, 32, .9); cursor: pointer; }
  .start h1 { margin: 0; font: 400 14cqw/.95 var(--f-slam); text-transform: uppercase; } .start h1 em { font-style: normal; color: var(--gold); }
  .start p { margin: 0; font: 700 3.6cqw/1.5 var(--f-cap); color: var(--muted); } .start kbd { font: 800 3.2cqw/1 var(--f-cap); padding: .6cqw 1.6cqw; border-radius: 1.2cqw; background: rgba(255, 255, 255, .14); }
  .start button { width: 22cqw; height: 22cqw; border-radius: 50%; border: 0; background: var(--gold); color: #170b2c; font: 400 9cqw/1 var(--f-slam); cursor: pointer; box-shadow: 0 1cqw 5cqw rgba(255, 209, 102, .45); }
  .start button:focus-visible { outline: 3px solid #fff; outline-offset: 4px; }
  .paused { position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%); z-index: 8; padding: 2cqw 5cqw; border-radius: 99px; background: rgba(0, 0, 0, .7); font: 900 4cqw/1 var(--f-cap); letter-spacing: .14em; }
</style>
<div class="stage" id="stage">
  <canvas id="fx"></canvas>
  <div class="top"><div class="brand">QUIZ de <em>cultură generală</em></div><div class="live"><i></i>LIVE</div></div>
  <div class="ws" id="ws" hidden></div>
  <div class="meta"><div class="chip" id="num">Întrebarea 1</div><div class="chip cat" id="cat">Geografie</div></div>
  <div class="card" id="card"><div class="q" id="q"></div></div>
  <div class="timer" id="timer"><svg viewBox="0 0 100 100"><circle cx="50" cy="50" r="44" fill="rgba(0,0,0,.35)" stroke="rgba(255,255,255,.14)" stroke-width="8"/>
    <circle id="ring" cx="50" cy="50" r="44" fill="none" stroke="#ffd166" stroke-width="8" stroke-linecap="round" stroke-dasharray="276.5" stroke-dashoffset="0"/></svg><div class="n" id="tn">15</div></div>
  <div class="opts" id="opts"></div>
  <div class="cta" id="cta">Scrie <em>A, B, C sau D</em> în chat 👇<div class="count" id="count"></div></div>
  <div class="fact" id="fact"></div>
  <div class="winners" id="winners"></div>
  <div class="foot" id="foot">Dă follow ca să nu ratezi următoarea rundă ❤️</div>
  <div class="inter" id="inter"><h2 id="iT"></h2><p id="iP"></p><div class="board" id="board"></div></div>
  <div class="paused" id="paused" hidden>PAUZĂ</div>
  <div class="start" id="start">
    <h1>Quiz <em>live</em></h1>
    <button id="go" aria-label="Pornește quizul">▶</button>
    <p>Click ca să pornești (pentru sunet).<br><kbd>Spațiu</kbd> pauză · <kbd>→</kbd> următoarea · <kbd>R</kbd> arată răspunsul · <kbd>M</kbd> sunet · <kbd>F</kbd> ecran complet</p>
  </div>
</div>

    if (wsOn && top.length) { $('iT').innerHTML = 'Clasamentul <em>live</em>'; $('iP').textContent = 'Primii 3 care răspund corect primesc puncte în plus.';
      $('board').innerHTML = top.map((s, k) => `<div><span>${k + 1}. ${s.nick.replace(/</g, '&lt;')}</span><span>${s.p} p</span></div>`).join(''); }
    else { $('iT').innerHTML = `Câte ai știut din <em>${EVERY}?</em>`; $('iP').textContent = 'Scrie scorul tău în chat 👇 Dă follow și share ca să joace și prietenii tăi!'; $('board').innerHTML = ''; }
    $('inter').classList.add('on'); sfx('cheer', .5);
  }
  let lastTick = -1;
  function loop(now) {
    drawFx(now / 1000);
    if (!paused && phase !== 'idle') {
      const left = Math.max(0, (tEnd - now) / 1000);
      if (phase === 'q') {
        const s = Math.ceil(left); $('tn').textContent = s; $('ring').style.strokeDashoffset = (276.5 * (1 - left / T_Q)).toFixed(1);
        $('ring').style.stroke = left <= 5 ? '#ff4d6d' : '#ffd166'; $('timer').classList.toggle('hot', left <= 5 && left > 0);
        if (left <= 5 && s !== lastTick && s > 0) { lastTick = s; sfx('tick', .55); }
        if (left <= 0) reveal();
      } else if (phase === 'r' && left <= 0) { $('card').classList.add('out'); if (EVERY > 0 && nQ % EVERY === 0) intermission(); else setTimeout(showQuestion, 450), phase = 'wait'; }
      else if (phase === 'i' && left <= 0) { $('inter').classList.remove('on'); phase = 'wait'; setTimeout(showQuestion, 500); }
    }
    requestAnimationFrame(loop);
  }
  requestAnimationFrame(loop);
  function start() { if (phase !== 'idle') return; audioInit(); if (ac) ac.resume(); $('start').hidden = true; showQuestion(); }
  $('go').addEventListener('click', e => { e.stopPropagation(); start(); });
  $('start').addEventListener('click', start);
  function togglePause() { if (phase === 'idle') return; paused = !paused; $('paused').hidden = !paused; if (paused) pauseLeft = tEnd - performance.now(); else tEnd = performance.now() + pauseLeft; }
  document.addEventListener('keydown', e => {
    if (e.code === 'Space') { e.preventDefault(); togglePause(); }
    else if (e.key === 'ArrowRight' && phase !== 'idle') { $('inter').classList.remove('on'); paused = false; $('paused').hidden = true; showQuestion(); }
    else if ((e.key === 'r' || e.key === 'R') && phase === 'q') reveal();
    else if (e.key === 'm' || e.key === 'M') { muted = !muted; if (master) master.gain.value = muted ? 0 : VOL; }
    else if (e.key === 'f' || e.key === 'F') { if (!document.fullscreenElement) document.documentElement.requestFullscreen?.(); else document.exitFullscreen?.(); }
    else if (e.key === 'Enter') start();
  });
  if (P.get('auto') === '1') { audioInit(); if (ac) ac.resume().catch(() => {}); $('start').hidden = true; showQuestion(); document.addEventListener('click', () => { audioInit(); if (ac) ac.resume(); }, { once: true }); }
})();
</script>
