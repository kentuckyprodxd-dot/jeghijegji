  .ws { position: absolute; right: 5%; top: 7.4%; z-index: 3; font: 800 2.6cqw/1 var(--f-cap); color: var(--muted); letter-spacing: .08em; }
  .start { position: absolute; inset: 0; z-index: 9; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 5cqw; text-align: center; padding: 0 8%; background: rgba(11, 8, 32, .9); cursor: pointer; }

  .start button { width: 22cqw; height: 22cqw; border-radius: 50%; border: 0; background: var(--gold); color: #170b2c; font: 400 9cqw/1 var(--f-slam); cursor: pointer; box-shadow: 0 1cqw 5cqw rgba(255, 209, 102, .45); }
  .start button:focus-visible { outline: 3px solid #fff; outline-offset: 4px; }
  .paused { position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%); z-index: 8; padding: 2cqw 5cqw; border-radius: 99px; background: rgba(0, 0, 0, .7); font: 900 4cqw/1 var(--f-cap); letter-spacing: .14em; }
</style>
