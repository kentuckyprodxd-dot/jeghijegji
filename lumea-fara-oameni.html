<!doctype html>
<html lang="ro">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Lumea fără noi</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Anton&family=Montserrat:wght@800;900&family=JetBrains+Mono:wght@700;800&display=swap">
<style>
  /* Cadru vertical 9:16, stil motion design: 3D dedesubt, grafică 2D animată din JS deasupra */
  :root {
    --bg: #07060d;
    --ink: #fff8ec;
    --gold: #ffd23f;
    --hot: #ff6b2c;
    --cyan: #5ce1ff;
    --muted: rgba(255, 248, 236, .72);
    --f-slam: "Anton", "Impact", "Arial Narrow", sans-serif;
    --f-cap: "Montserrat", "Arial Black", system-ui, sans-serif;
    --f-mono: "JetBrains Mono", ui-monospace, Menlo, monospace;
    color-scheme: dark;
  }
  [hidden] { display: none !important; }
  html, body { height: 100%; margin: 0; }
  body {
    background: var(--bg); color: var(--ink); font-family: var(--f-cap);
    display: grid; place-items: center;
    padding-left: max(16px, env(safe-area-inset-left, 0px));
    padding-right: max(16px, env(safe-area-inset-right, 0px));
    padding-block: 12px; box-sizing: border-box; overflow: hidden;
    -webkit-tap-highlight-color: transparent;
  }
  .stage {
    position: relative;
    width: min(100%, calc((100dvh - 24px - env(safe-area-inset-top, 0px) - env(safe-area-inset-bottom, 0px)) * 9 / 16));
    aspect-ratio: 9 / 16; max-width: 100%;
    border-radius: 16px; overflow: hidden; background: #000;
    box-shadow: 0 30px 80px rgba(0, 0, 0, .6);
    user-select: none; -webkit-user-select: none; container-type: inline-size;
  }
  canvas#gl { position: absolute; inset: -3%; width: 106%; height: 106%; display: block; will-change: transform, filter; }
  .grain { position: absolute; inset: 0; z-index: 6; pointer-events: none; opacity: .09; mix-blend-mode: overlay; background-size: 256px 256px; }
  .vig { position: absolute; inset: 0; z-index: 2; pointer-events: none;
    background: radial-gradient(120% 80% at 50% 48%, transparent 58%, rgba(0, 0, 0, .55) 100%), linear-gradient(to top, rgba(0, 0, 0, .5), transparent 30%); }
  .flash { position: absolute; inset: 0; z-index: 7; background: #fff; opacity: 0; pointer-events: none; }
  .fade { position: absolute; inset: 0; z-index: 7; background: #000; opacity: 0; pointer-events: none; }

  .hud { position: absolute; left: 5%; top: 3.6%; z-index: 5; font-family: var(--f-mono); text-shadow: 0 2px 10px rgba(0, 0, 0, .7); opacity: 0; }
  .hud .t { font-size: 7.6cqw; font-weight: 800; letter-spacing: .02em; line-height: 1; font-variant-numeric: tabular-nums; }
  .hud .t small { font-size: .5em; color: var(--gold); margin-right: .25em; vertical-align: .35em; }
  .hud .row { margin-top: 1.4cqw; font-size: 3.1cqw; font-weight: 700; color: var(--muted); letter-spacing: .06em; font-variant-numeric: tabular-nums; }
  .hud .row b { color: var(--ink); font-weight: 800; }

  .ruler { position: absolute; left: 4.2%; top: 25%; height: 46%; width: 2.6cqw; z-index: 5; opacity: 0; }
  .ruler .bar { position: absolute; inset: 0; border-radius: 99px; overflow: hidden; box-shadow: 0 0 0 1.5px rgba(0, 0, 0, .55), 0 4px 18px rgba(0, 0, 0, .5);
    background: linear-gradient(to bottom, #6b4a2e 0 .4%, #c4371f .4%, #ff6a2a 22.6%, #ff9f1f 22.7%, #ffc94a 40.4%, #fff3b8 40.5%, #fff3b8 59.5%, #ffc94a 59.6%, #ff9f1f 77.3%, #ff6a2a 77.4%, #c4371f 99.6%, #1c6fb8 99.6%); }
  .ruler .dot { position: absolute; left: 50%; width: 4.4cqw; height: 4.4cqw; margin: -2.2cqw 0 0 -2.2cqw; border-radius: 50%; background: #fff; box-shadow: 0 0 0 1cqw rgba(255, 255, 255, .25), 0 0 4cqw rgba(255, 255, 255, .8); }
  .ruler .lbl { position: absolute; left: 4.4cqw; font: 800 2.5cqw/1 var(--f-mono); letter-spacing: .08em; color: var(--muted); white-space: nowrap; transform: translateY(-50%); text-shadow: 0 1px 6px rgba(0, 0, 0, .8); }

  .title { position: absolute; left: 6%; right: 6%; top: 15%; z-index: 4; text-align: center; font: 400 15cqw/.92 var(--f-slam); text-transform: uppercase; letter-spacing: .01em;
    text-shadow: .04em .04em 0 #000, 0 0 40px rgba(0, 0, 0, .6); opacity: 0; }
  .title em { font-style: normal; color: var(--gold); }

  .slam { position: absolute; left: 4%; right: 4%; top: 31%; z-index: 4; text-align: center; opacity: 0; pointer-events: none; }
  .slam .big { font: 400 21cqw/.9 var(--f-slam); letter-spacing: .005em; white-space: nowrap; color: var(--ink);
    text-shadow: -.035em 0 0 rgba(255, 40, 80, .85), .035em 0 0 rgba(40, 220, 255, .85), .05em .06em 0 #000; }
  .slam .sub { margin-top: 2.6cqw; display: inline-block; padding: 1.4cqw 3cqw; background: var(--gold); color: #120d02; font: 900 3.7cqw/1.15 var(--f-cap); text-transform: uppercase; letter-spacing: .03em; transform: rotate(-2deg); box-shadow: .6cqw .6cqw 0 #000; }
  .slam.hot .big { color: var(--hot); } .slam.cyan .big { color: var(--cyan); } .slam.gold .big { color: var(--gold); }

  .cap { position: absolute; left: 5%; right: 5%; bottom: 13%; z-index: 4; text-align: center; font: 900 8.6cqw/1.08 var(--f-cap); text-transform: uppercase; letter-spacing: -.01em;
    -webkit-text-stroke: .3cqw #000; paint-order: stroke fill; text-shadow: 0 .6cqw 0 #000, 0 0 30px rgba(0, 0, 0, .55); }
  .cap span { display: inline-block; }
  .cap .hl { color: var(--gold); }

  .snd { position: absolute; top: 3.6%; right: 5%; z-index: 9; width: 9.5cqw; height: 9.5cqw; min-width: 34px; min-height: 34px; border: 0; border-radius: 50%; padding: 0;
    background: rgba(0, 0, 0, .42); color: var(--ink); display: grid; place-items: center; cursor: pointer; backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px); }
  .snd svg { width: 52%; height: 52%; fill: currentColor; }
  .snd:focus-visible, .play:focus-visible { outline: 2px solid var(--gold); outline-offset: 3px; }
  .overlay { position: absolute; inset: 0; z-index: 8; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 5cqw; text-align: center; padding: 0 8%; cursor: pointer;
    background: radial-gradient(circle at 50% 52%, rgba(7, 6, 13, .1), rgba(7, 6, 13, .8)); }
  .overlay h1 { margin: 0; font: 400 15cqw/.92 var(--f-slam); text-transform: uppercase; text-shadow: .04em .04em 0 #000; }
  .overlay h1 em { font-style: normal; color: var(--gold); }
  .overlay p { margin: 0; font: 800 3.4cqw/1.4 var(--f-cap); color: var(--muted); }
  .play { width: 21cqw; height: 21cqw; border-radius: 50%; border: 0; padding: 0; background: var(--gold); color: #120d02; display: grid; place-items: center; cursor: pointer; box-shadow: .8cqw .8cqw 0 #000; }
  .play svg { width: 40%; height: 40%; fill: currentColor; margin-left: 8%; }
  .play.busy { opacity: .5; } .play.again svg { margin-left: 0; }
  .overlay.paused { background: rgba(7, 6, 13, .35); }
  .sources { font: 800 2.6cqw/1.5 var(--f-cap); color: var(--muted); max-width: 92%; text-transform: none; }
</style>
</head>
<body>
<body>
<div class="stage" id="stage">
  <canvas id="gl"></canvas>
  <div class="vig"></div>
  <div class="hud" id="hud">
    <div class="row" id="hL">FĂRĂ OAMENI DE</div>
    <div class="t" id="hVal">3 ORE</div>
  </div>
  <div class="title" id="title">Ce-ar fi dacă toți oamenii ar <em>dispărea</em>?</div>
  <div class="slam" id="slam"><div class="big" id="slamBig"></div><div class="sub" id="slamSub"></div></div>
  <div class="cap" id="cap"></div>
  <div class="grain" id="grain"></div>
  <div class="flash" id="flash"></div>
  <div class="fade" id="fade"></div>

  <button class="snd" id="snd" aria-label="Oprește sunetul" hidden>
    <svg viewBox="0 0 24 24" id="sndOn"><path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3A4.5 4.5 0 0 0 14 8v8a4.5 4.5 0 0 0 2.5-4zM14 3.2v2.1a7 7 0 0 1 0 13.4v2.1a9 9 0 0 0 0-17.6z"/></svg>
    <svg viewBox="0 0 24 24" id="sndOff" hidden><path d="M16.5 12A4.5 4.5 0 0 0 14 8v2.2l2.45 2.45c.03-.2.05-.42.05-.65zM19 12c0 .94-.2 1.82-.54 2.64l1.51 1.51A8.8 8.8 0 0 0 21 12a9 9 0 0 0-7-8.8v2.1A7 7 0 0 1 19 12zM4.27 3 3 4.27 7.73 9H3v6h4l5 5v-6.73l4.25 4.25c-.67.52-1.42.93-2.25 1.18v2.1a9 9 0 0 0 3.69-1.81L19.73 21 21 19.73l-9-9L4.27 3zM12 4 9.91 6.09 12 8.18V4z"/></svg>
  </button>
  <div class="overlay" id="start">
    <h1>Dacă toți oamenii ar <em>dispărea</em></h1>
    <button class="play busy" id="playBtn" aria-label="Pornește videoul"><svg viewBox="0 0 24 24"><path d="M7 4.5v15l12.5-7.5z"/></svg></button>
    <p id="startHint">Se încarcă…</p>
  </div>
  <div class="overlay paused" id="paused" hidden>
    <button class="play" aria-label="Continuă"><svg viewBox="0 0 24 24"><path d="M7 4.5v15l12.5-7.5z"/></svg></button>
  </div>
  <div class="overlay" id="end" hidden>
    <h1>Ce-ar rămâne <em>după noi</em>?</h1>
    <button class="play again" id="againBtn" aria-label="Vezi din nou"><svg viewBox="0 0 24 24"><path d="M12 5V1L7 6l5 5V7a6 6 0 1 1-6 6H4a8 8 0 1 0 8-8z"/></svg></button>
    <div class="sources">Scenariu inspirat din „The World Without Us" (Alan Weisman, 2007) și din documentarul „Life After People" (History, 2008). Momentele sunt aproximative.</div>
  </div>
</div>

      if ((sec === 'wild' && t > S[3].start) || sec === 'forest') if (rand() < .3) events.push({ at: t + rand() * .2, k: 'bird' });
    }
    events.push({ at: T_GONE - .05, k: 'vanish' });
    for (let k = 0; k < 5; k++) events.push({ at: A(1, 1) + k * .9, k: 'off' });
    for (let k = 0; k < 3; k++) events.push({ at: A(2, 1) + .2 + k * .5, k: 'bark' });
    for (let k = 0; k < 10; k++) events.push({ at: A(5, 6) + k * .32, k: 'beep', f: k % 3 ? 1400 : 1900 });
    CUTS.forEach(c => events.push({ at: c - .12, k: 'whoosh' }));
    SLAMS.forEach(s => events.push({ at: s[0], k: 'hit' }));
    events.sort((a, b) => a.at - b.at);
  }
  let t0 = 0, evIx = 0;
  function play_(e) {
    const at = t0 + e.at;
    switch (e.k) {
      case 'pad': e.ch.forEach(m => { tone('triangle', mtof(m), at, .8, .028 * e.soft, 1, at + e.len, musicLP); tone('sawtooth', mtof(m) * 1.004, at, 1, .009 * e.soft, 1, at + e.len, musicLP); }); break;
      case 'piano': { const f = mtof(e.m); [[1, 1], [2, .35], [3, .12]].forEach(([h, a]) => { const o = ac.createOscillator(), g2 = ac.createGain(); o.type = 'sine'; o.frequency.value = f * h;
        g2.gain.setValueAtTime(0, at); g2.gain.linearRampToValueAtTime(e.v * a, at + .006); g2.gain.exponentialRampToValueAtTime(.0001, at + 2.2 / h); o.connect(g2); g2.connect(musicLP); o.start(at); o.stop(at + 2.3); track(o); }); break; }
      case 'kick': kick(at, e.p); break;
      case 'tick': tone('sine', 1700, at, .001, .02, .02, at + .04, musicBus); break;
      case 'bird': { const base = 2600 + rand() * 1600; for (let k = 0; k < 2 + (rand() * 3 | 0); k++) tone('sine', base, at + k * .09, .005, .03, .03, at + k * .09 + .07, sfxBus, base * (1.3 + rand() * .4)); break; }
      case 'vanish': tone('sine', 600, at, .02, .08, .5, at + .9, sfxBus, 2400); noise(at, .8, .1, 3000, 9000, sfxBus, 'bandpass', 1.5); break;
      case 'off': tone('square', 120, at, .002, .06, .1, at + .25, sfxBus, 60); noise(at, .2, .12, 900, 200, sfxBus, 'lowpass', .7); break;
      case 'bark': tone('sawtooth', 520, at, .005, .1, .05, at + .14, sfxBus, 300); noise(at, .12, .1, 1200, 700, sfxBus, 'bandpass', 2); break;
      case 'beep': tone('sine', e.f, at, .003, .035, .02, at + .12, sfxBus); break;
      case 'whoosh': noise(at, .5, .18, 500, 3500, sfxBus, 'bandpass', .8); break;
      case 'hit': tone('sine', 100, at, .002, .18, .3, at + .45, sfxBus, 40); noise(at, .25, .1, 2500, 400, sfxBus, 'lowpass', .5); break;
    }
  }
  function scheduleMusic(ahead = 2.5) { const now = ac.currentTime - t0; while (evIx < events.length && events[evIx].at < now + ahead) play_(events[evIx++]); }
  function startAudio() {
    live.splice(0).forEach(o => { try { o.stop(); } catch (e) {} });
    t0 = ac.currentTime + .15; evIx = 0; buildScore();
    buffers.forEach((b, i) => { const s = ac.createBufferSource(); s.buffer = b; s.connect(voiceBus); s.start(t0 + S[i].start); track(s); });
    const mg = musicBus.gain; mg.cancelScheduledValues(0); mg.setValueAtTime(.0001, t0); mg.linearRampToValueAtTime(.55, t0 + .6);
    mg.setValueAtTime(.55, t0 + END); mg.linearRampToValueAtTime(0, t0 + TOTAL + .2);
    const f = musicLP.frequency; f.cancelScheduledValues(0);
    for (let x = 0; x < TOTAL; x += .25) f.setValueAtTime({ city: 1800, dark: 500, wild: 2000, forest: 3200, end: 1500 }[SECT(x)], t0 + x);
    // zumzetul orașului la început, apoi vânt prin frunze
    const ws = ac.createBufferSource(), wf = ac.createBiquadFilter(), wg = ac.createGain(); ws.buffer = noiseBuf; ws.loop = true; wf.type = 'bandpass'; wf.Q.value = .6;
    ws.connect(wf); wf.connect(wg); wg.connect(sfxBus);
    for (let x = 0; x < TOTAL; x += .1) { const sec = SECT(x); wg.gain.setValueAtTime(sec === 'city' ? .05 : sec === 'dark' ? .015 : .04 + .02 * Math.sin(x * .8), t0 + x); wf.frequency.setValueAtTime(sec === 'city' ? 250 : 900 + 400 * Math.sin(x * .5), t0 + x); }
    ws.start(t0); ws.stop(t0 + TOTAL + .5); track(ws);
  }

  let keepAlive = null;
  function iosUnmute() {
    try { if (navigator.audioSession) navigator.audioSession.type = 'playback'; } catch (e) {}
    if (keepAlive) { keepAlive.play().catch(() => {}); return; }
    const sr = 8000, n = sr / 2, buf = new ArrayBuffer(44 + n * 2), v = new DataView(buf);
    const w = (o, s) => [...s].forEach((c, k) => v.setUint8(o + k, c.charCodeAt(0)));
    w(0, 'RIFF'); v.setUint32(4, 36 + n * 2, true); w(8, 'WAVEfmt '); v.setUint32(16, 16, true); v.setUint16(20, 1, true); v.setUint16(22, 1, true);
    v.setUint32(24, sr, true); v.setUint32(28, sr * 2, true); v.setUint16(32, 2, true); v.setUint16(34, 16, true); w(36, 'data'); v.setUint32(40, n * 2, true);
    keepAlive = new Audio(URL.createObjectURL(new Blob([buf], { type: 'audio/wav' }))); keepAlive.loop = true; keepAlive.setAttribute('playsinline', ''); keepAlive.play().catch(() => {});
  }


  // ---------- Redare ----------
  const startEl = $('start'), pausedEl = $('paused'), endEl = $('end'), playBtn = $('playBtn'), sndBtn = $('snd');
  let state = 'idle', fallbackT = 0, fallbackFrom = 0, muted = false;
  const now = () => performance.now() / 1000;
  const getT = () => { if (state === 'idle') return 0; if (ac && buffers.length) return Math.max(0, ac.currentTime - t0); return fallbackT + (state === 'playing' ? now() - fallbackFrom : 0); };
  setupAudio();
  const assetsReady = Promise.all([fontsReady, landReady, decoding || Promise.resolve()]).catch(() => {});
  assetsReady.then(() => { playBtn.classList.remove('busy'); $('startHint').textContent = 'Cu sunet · ' + Math.floor(TOTAL / 60) + ':' + String(Math.round(TOTAL % 60)).padStart(2, '0'); });
  function play() {
    if (playBtn.classList.contains('busy')) return;
    iosUnmute(); startEl.hidden = true; endEl.hidden = true; sndBtn.hidden = false; curSlam = curCap = -2;
    if (ac) { ac.resume(); if (buffers.length) startAudio(); }
    fallbackT = 0; fallbackFrom = now(); state = 'playing';
  }
  function pause() { if (state !== 'playing') return; state = 'paused'; fallbackT += now() - fallbackFrom; if (ac) ac.suspend(); pausedEl.hidden = false; }
  function resume() { if (state !== 'paused') return; pausedEl.hidden = true; fallbackFrom = now(); state = 'playing'; iosUnmute(); if (ac) ac.resume(); }
  function finish() { state = 'ended'; endEl.hidden = false; endEl.style.opacity = 1; sndBtn.hidden = true; }
  playBtn.addEventListener('click', e => { e.stopPropagation(); play(); });
  startEl.addEventListener('click', e => { e.stopPropagation(); play(); });
  $('againBtn').addEventListener('click', e => { e.stopPropagation(); play(); });
  pausedEl.addEventListener('click', e => { e.stopPropagation(); resume(); });
  stage.addEventListener('click', e => { if (state === 'playing' && !e.target.closest('.snd')) pause(); });
  sndBtn.addEventListener('click', e => { e.stopPropagation(); muted = !muted; if (master) master.gain.setTargetAtTime(muted ? 0 : .85, ac.currentTime, .05);
    $('sndOn').hidden = muted; $('sndOff').hidden = !muted; sndBtn.setAttribute('aria-label', muted ? 'Pornește sunetul' : 'Oprește sunetul'); });
  document.addEventListener('visibilitychange', () => { if (document.hidden) pause(); });


  const locate = t => { for (let i = 0; i < S.length; i++) if (t < S[i].start + S[i].len) return [i, t - S[i].start]; return [S.length - 1, t - S[S.length - 1].start]; };

  function renderAt(t, clk, withText) {
    updateWorld(t, clk); renderer.render(SB, camera);
    if (withText) { const [i, lt] = locate(t); updateText(t, i, lt); updateFx(t); }
  }

  function frame(ms) {
    let t = getT();
    if (state === 'playing' && t >= TOTAL) finish();
    if (state === 'ended') t = TOTAL;
    if (state === 'playing' && t >= END + .4) { endEl.hidden = false; endEl.style.opacity = ss(END + .4, END + 1.1, t); }
    renderAt(t, state === 'idle' ? ms / 1000 : t, state !== 'idle');
    fadeEl.style.opacity = state === 'idle' ? 0 : (1 - ss(0, .35, t));
    if (ac && state === 'playing' && buffers.length) scheduleMusic();
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
})();
</script>
